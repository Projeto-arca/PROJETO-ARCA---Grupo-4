<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Programa ARCA – Minhas Denúncias</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/denuncias.css" />
</head>
<body>

  <nav class="navbar">
    <a class="navbar__logo">Programa Arca</a>

    <div class="navbar__busca-wrapper">
      <input type="text" class="navbar__busca" placeholder="Buscar" aria-label="Buscar" />
    </div>

    <ul class="navbar__menu">
      <li><a href="dashtutor.html">Dashboard</a></li>
      <li><a href="meuspetstutor.html">Meus Pets</a></li>
      <li><a href="solicitacoes.html">Solicitações</a></li>
      <li><a href="denuncias.html" class="active">Denunciar</a></li>
    </ul>

  </nav>

  <main class="main">
    <div class="layout">

      <section class="coluna-esq">
        <div class="coluna-esq__topo">
          <h1 class="secao-titulo">Minhas Denúncias</h1>
          <p class="secao-subtitulo">Acompanhe o status das denúncias que você realizou.</p>

          <div class="filtros-barra">
            <button class="aba aba-ativa">Todas</button>
            <input type="text" class="busca-denuncia" placeholder="Buscar denúncia..." aria-label="Buscar denúncia" />
          </div>
        </div>

        <div class="tabela-wrapper">
          <table class="tabela">
            <thead>
              <tr>
                <th>
                  ID
                  <span class="sort-icon">
                    <svg viewBox="0 0 10 14" fill="none"><path d="M5 1v12M1 5l4-4 4 4M1 9l4 4 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </span>
                </th>
                <th>
                  Local
                  <span class="sort-icon">
                    <svg viewBox="0 0 10 14" fill="none"><path d="M5 1v12M1 5l4-4 4 4M1 9l4 4 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </span>
                </th>
                <th>
                  Data
                  <span class="sort-icon">
                    <svg viewBox="0 0 10 14" fill="none"><path d="M5 1v12M1 5l4-4 4 4M1 9l4 4 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </span>
                </th>
                <th>
                  Status
                  <span class="sort-icon">
                    <svg viewBox="0 0 10 14" fill="none"><path d="M5 1v12M1 5l4-4 4 4M1 9l4 4 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </span>
                </th>
                <th>
                  Última atualização
                  <span class="sort-icon">
                    <svg viewBox="0 0 10 14" fill="none"><path d="M5 1v12M1 5l4-4 4 4M1 9l4 4 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </span>
                </th>
              </tr>
            </thead>
            <tbody>
              <tr class="linha-ativa" id="linhaDestaque">
                <td class="col-id">#0041</td>
                <td>Vila Velha - ES</td>
                <td>15/05/2026</td>
                <td><span class="badge badge-pendente">Pendente</span></td>
                <td></td>
              </tr>
            </tbody>
          </table>

          <div class="tabela-area-vazia"></div>
        </div>
      </section>

      <aside class="coluna-dir">
        <h2 class="detalhe-titulo">Detalhes da Denúncia</h2>

        <div class="detalhe-card">
          <div class="campo-grupo">
            <label class="campo-label">Detalhes adicionais</label>
            <textarea class="campo-textarea" rows="4">Foi observado um cachorro em situação de maus-tratos, mantido em local sujo, sem água e comida, e aparentando ferimentos. O responsável pelo animal o agride com frequência.</textarea>
          </div>

          <div class="campo-grupo">
            <label class="campo-label" for="inputAnimal">Animal</label>
            <input type="text" id="inputAnimal" class="campo-input" value="Cachorro" />
          </div>

          <div class="campo-grupo">
            <label class="campo-label" for="inputLocal">Localização</label>
            <input type="text" id="inputLocal" class="campo-input" value="Vila Velhas - ES" />
          </div>

          <div class="campo-grupo">
            <label class="campo-label" for="inputData">Data e horário</label>
            <input type="text" id="inputData" class="campo-input" value="15/05/2026  14:32" />
          </div>

          <div class="campo-grupo">
            <label class="campo-label">Anexos:</label>
            <div class="anexos-grid">
              <div class="anexo-foto">
                <img
                  src="https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=400&q=80"
                  alt="Foto do animal denunciado"
                  class="anexo-img"
                />
              </div>
              <div class="anexo-placeholder">
                <svg class="anexo-icone" viewBox="0 0 24 24" fill="none" stroke="#1b5e42" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                  <circle cx="12" cy="13" r="4"/>
                  <circle cx="19.5" cy="9.5" r="1" fill="#1b5e42" stroke="none"/>
                </svg>
                <span class="anexo-texto">Anexar foto</span>
              </div>
            </div>
          </div>

          <div class="detalhe-acoes">
            <button class="btn-cancelar">Cancelar</button>
            <button class="btn-criar">Criar solicitação</button>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <footer class="rodape">
    <span class="rodape-item">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="8" cy="8" r="7"/><line x1="8" y1="7" x2="8" y2="11"/><circle cx="8" cy="5" r=".5" fill="currentColor" stroke="none"/></svg>
      Ajuda
    </span>
    <span class="rodape-item">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M8 1l1.8 3.6L14 5.3l-3 2.9.7 4.1L8 10.4l-3.7 1.9.7-4.1-3-2.9 4.2-.7z"/></svg>
      Privacidade
    </span>
  </footer>

  <script>
    const btnMenu = document.getElementById('btnMenu');
    const drawer  = document.getElementById('drawerMenu');
    btnMenu.addEventListener('click', () => {
      const aberto = drawer.classList.toggle('open');
      btnMenu.setAttribute('aria-expanded', String(aberto));
    });
    document.addEventListener('click', e => {
      if (!drawer.contains(e.target) && !btnMenu.contains(e.target)) {
        drawer.classList.remove('open');
      }
    });
  </script>

</body>
</html>
